name: Deploy to EC2

on:
  push:
    branches:
      - artnest-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd artnest
            git pull origin artnest-dev
            mvn clean package -DskipTests
            pkill -f 'java -jar'
            nohup java -jar target/artnest-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
